<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select players - Custom Dart Games</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="board">
    <a class="link-back-icon" th:href="@{/dart/play}" title="Back to game selection" aria-label="Back to game selection">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </a>

    <h1 class="board-title">Select players</h1>
    <span class="board-subtitle" th:text="${game.name}">Game</span>

    <p class="player-count" id="player-count" th:if="${playerNumber != null}">
        0 / <span th:text="${playerNumber}">4</span> selected
    </p>

    <form th:action="@{/dart/play/start-game}" method="post">
        <input type="hidden" name="gameId" th:value="${game.id}">
        <input type="hidden" name="orderedPlayerIds" id="ordered-player-ids">

        <!----------------------------    PLAYER PICKER OVERLAY  ------------------------------------------>

        <!-- data-max-players (optional, blank if playerNumber is null) drives the
             selection cap in player-setup.js; chip-order badges show click order. -->
        <div class="player-picker" th:if="${!users.isEmpty()}" th:attr="data-max-players=${playerNumber}">
            <label class="player-chip" th:each="player : ${users}">
                <input type="checkbox" th:value="${player.id}">
                <span th:text="${player.username}">Name</span>
                <span class="chip-order" data-role="chip-order"></span>
            </label>
        </div>

        <!----------------------------    PLAYER PICKER OVERLAY  ------------------------------------------>

        <p class="board-text" th:if="${users.isEmpty()}">
            No players yet. <a th:href="@{/dart/players/new}">Add one</a> first.
        </p>

        <button type="submit" class="btn-block" th:if="${!users.isEmpty()}">Start</button>
    </form>
</main>
<script th:src="@{/js/player-setup.js}" defer></script>
</body>
</html>
