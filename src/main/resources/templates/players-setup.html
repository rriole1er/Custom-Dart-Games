<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{generic/page-head :: pageHead('Select players - Custom Dart Games')}"></head>
<body>
<main class="board">
    <div th:replace="~{generic/back-link :: backLink(@{/dart/play}, 'Back to game selection', false)}"></div>

    <h1 class="board-title">Sélection des joueurs / joueuses</h1>
    <span class="board-subtitle" th:text="${game.name}">Game</span>

    <p class="player-count" id="player-count" th:if="${playerNumber != null}">
        0 / <span th:text="${playerNumber}">4</span> selected
    </p>

    <form th:action="@{/dart/play/start-game}" method="post">
        <input type="hidden" name="gameId" th:value="${game.id}">
        <input type="hidden" name="orderedPlayerIds" id="ordered-player-ids">

        <!----------------------------    PLAYER PICKER OVERLAY  ------------------------------------------>

        <!-- data-max-players (optional, blank if playerNumber is null) drives the
             selection cap in player-setup.js; data-min-players gates the Start
             button (every dart game needs at least 2 players, regardless of
             game type, so it's a fixed value rather than tied to playerNumber);
             chip-order badges show click order. data-stopper-count (optional,
             blank unless the controller sets a `stopperCount` model attribute
             — 1 for Scram 2v1's lone stopper, 2 for 2v2's stopper pair) colors
             the first stopper-count picks green and the rest red, so it's
             clear who's paired against whom before the game starts; absent
             for every other game, where player-setup.js leaves chips
             uncolored. -->
        <div class="player-picker" th:if="${!users.isEmpty()}" data-min-players="2"
             th:attr="data-max-players=${playerNumber},data-stopper-count=${stopperCount}">
            <label class="player-chip" th:each="player : ${users}">
                <input type="checkbox" th:value="${player.id}">
                <span th:text="${player.username}">Name</span>
                <span class="chip-order" data-role="chip-order"></span>
                <span class="chip-role" data-role="chip-role"></span>
            </label>
        </div>

        <!----------------------------    PLAYER PICKER OVERLAY  ------------------------------------------>

        <p class="board-text" th:if="${users.isEmpty()}">
            No players yet. <a th:href="@{/dart/players/new}">Add one</a> first.
        </p>

        <button type="submit" class="btn-block" th:if="${!users.isEmpty()}">Démarrer</button>
    </form>
</main>
<script th:src="@{/js/player-setup.js}" defer></script>
</body>
</html>
