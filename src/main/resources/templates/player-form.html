<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add player - Custom Dart Games</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="board">
        <h1 class="board-title">New player</h1>
        <form class="player-form" th:action="@{/dart/add}" method="post">
            <input type="text" name="username" placeholder="Player name" required autofocus>
            <button type="submit" class="btn-oval btn-play">Save</button>
        </form>
        <a class="link-back-icon" th:href="@{/dart/players}" title="Back to players" aria-label="Back to players">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        </a>
    </main>
</body>
</html>
