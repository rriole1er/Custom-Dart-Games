<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{generic/page-head :: pageHead(${game.name} + ' - Custom Dart Games')}"></head>
<body>
<main class="game-screen">
    <div th:replace="~{generic/back-link :: backLink(@{/dart/play}, 'Retour à la sélection du jeu', true)}"></div>

    <h1 class="game-title" th:text="${game.name}">Game</h1>

    <!----------------------------    PLAYER OVERLAY  ------------------------------------------>


    <div class="players-stack" id="players-stack">
        <section class="player-panel" th:each="player, iter : ${players}"
                 th:classappend="${iter.index == 0} ? ' active' : ''"
                 th:attr="data-player-id=${player.id}, data-player-name=${player.username}">
            <div th:replace="~{generic/player-panel-header :: playerPanelHeader('Tours : 0', true)}"></div>

            <div class="player-score" data-role="score" th:text="${startingScore}">501</div>

            <div class="checkout-hint" data-role="checkout" hidden>
                <span class="checkout-combo" data-role="checkout-combo"></span>
                <button type="button" class="checkout-refresh" data-role="checkout-refresh" title="Autre combinaison">
                    &#8635;
                </button>
            </div>

            <div class="player-progress">
                <div class="player-progress-bar" data-role="progress"></div>
            </div>
        </section>
    </div>

    <!----------------------------    PLAYER OVERLAY  ------------------------------------------>


    <div class="keypad-panel" id="keypad-panel">
        <div class="keypad-toolbar">
            <span class="keypad-toolbar-spacer" aria-hidden="true"></span>
            <div class="keypad-display" data-role="input-display">0</div>
            <button type="button" class="keypad-mode-toggle" data-action="toggle-mode" title="Basculer le clavier">
                &#9678;
            </button>
        </div>
        <p class="keypad-breakdown" data-role="segment-breakdown"></p>

        <!----------------------------    CLASSIC PAD OVERLAY  ------------------------------------------>

        <div class="keypad" data-role="keypad-total">
            <button type="button" class="keypad-btn" data-digit="1">1</button>
            <button type="button" class="keypad-btn" data-digit="2">2</button>
            <button type="button" class="keypad-btn" data-digit="3">3</button>
            <button type="button" class="keypad-btn" data-digit="4">4</button>
            <button type="button" class="keypad-btn" data-digit="5">5</button>
            <button type="button" class="keypad-btn" data-digit="6">6</button>
            <button type="button" class="keypad-btn" data-digit="7">7</button>
            <button type="button" class="keypad-btn" data-digit="8">8</button>
            <button type="button" class="keypad-btn" data-digit="9">9</button>
        </div>

        <div class="keypad-zero-row" data-role="keypad-zero-row">
            <button type="button" class="keypad-btn" data-digit="0">0</button>
            <button type="button" class="keypad-btn keypad-btn-muted" data-action="clear" title="Effacer">&#9003;
            </button>
        </div>

        <!----------------------------    CLASSIC PAD OVERLAY  ------------------------------------------>


        <!----------------------------    SEGMENT PAD OVERLAY  ------------------------------------------>

        <div th:replace="~{generic/segment-keypad :: segmentKeypad('keypad-segments', true)}"></div>

        <button type="button" class="keypad-btn keypad-btn-muted keypad-btn-erase" data-role="keypad-segment-erase"
                data-action="clear" hidden title="Effacer">&#9003;
        </button>

        <!----------------------------    SEGMENT PAD OVERLAY  ------------------------------------------>


        <div class="keypad-actions">
            <button type="button" class="keypad-btn keypad-btn-danger" data-action="undo">ANNULER</button>
            <button type="button" class="keypad-btn keypad-btn-primary" data-action="done">Terminer</button>
        </div>
    </div>

    <!----------------------------    WIN OVERLAY  ------------------------------------------>

    <div th:replace="~{generic/win-overlay :: winOverlay}"></div>


    <!----------------------------    WIN OVERLAY  ------------------------------------------>


    <!----------------------------    EXIT OVERLAY  ----------------------------------------->

    <div th:replace="~{generic/exit-overlay :: exitOverlay}"></div>

    <!----------------------------    EXIT OVERLAY  ----------------------------------------->

</main>
<script th:src="@{/js/game-common.js}" defer></script>
<script th:src="@{/js/game-countdown.js}" defer></script>
</body>
</html>
