    <div class="players-stack" id="players-stack">
        <section class="player-panel purple-panel" th:each="player, iter : ${players}"
                 th:classappend="${iter.index == 0} ? ' active' : ''"
                 th:attr="data-player-id=${player.id}, data-player-name=${player.username}">
            <div class="player-panel-header">
                <span data-role="turns">Tours : 0</span>
                <span class="player-name" th:text="${player.username}">Name</span>
            </div>

            <div class="purple-turn-action">
                <p class="purple-hint" data-role="hint" hidden>Définis la zone à viser sur la cible ci-dessus</p>
                <p class="purple-status" data-role="status" hidden>Éliminé</p>
                <button type="button" class="btn-block purple-achieve-btn" data-role="achieve-btn" hidden>J'ai touché
                    !
                </button>
            </div>
        </section>
    </div>

    <div th:replace="~{generic/turn-actions :: turnActions}"></div>

    <div th:replace="~{generic/win-overlay :: winOverlay}"></div>

    <!----------------------------    WIN OVERLAY  ------------------------------------------>
