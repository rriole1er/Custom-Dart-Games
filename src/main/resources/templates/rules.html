<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rules - Custom Dart Games</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="board board-wide">
    <a class="link-back-icon" th:href="@{/dart/}" title="Back to home" aria-label="Back to home">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M11 18l-6-6 6-6"/>
        </svg>
    </a>

    <h1 class="board-title">Règles des jeux</h1>

    <div class="rules-list" th:if="${!games.isEmpty()}">
        <details class="rules-item" th:each="game : ${games}">
            <summary th:text="${game.name}">Game</summary>
            <p class="rules-text" th:text="${game.description}">Description</p>
        </details>
    </div>

    <p class="board-text" th:if="${games.isEmpty()}">No games yet.</p>
</main>
</body>
</html>
