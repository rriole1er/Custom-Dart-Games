<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{generic/page-head :: pageHead('Rules - Custom Dart Games')}"></head>
<body>
<main class="board board-wide">
    <div th:replace="~{generic/back-link :: backLink(@{/dart/}, 'Back to home', false)}"></div>

    <h1 class="board-title">Règles des jeux</h1>

    <div class="rules-list" th:if="${!games.isEmpty()}">
        <details class="rules-item" th:each="game : ${games}">
            <summary th:text="${game.name}">Game</summary>
            <p class="rules-text" th:text="${game.description}">Description</p>
        </details>
    </div>

    <p class="board-text" th:if="${games.isEmpty()}">No games yet.</p>
</main>
</body>
</html>
