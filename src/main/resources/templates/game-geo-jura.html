<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{generic/page-head :: pageHead(${game.name} + ' - Custom Dart Games')}"></head>
<body>
<main class="game-screen">
    <div th:replace="~{generic/back-link :: backLink(@{/dart/play}, 'Retour à la sélection du jeu', true)}"></div>

    <h1 class="game-title" th:text="${game.name}">Game</h1>

    <!----------------------------    PLAYER OVERLAY  ------------------------------------------>

    <div class="players-stack" id="players-stack">
        <section class="player-panel geo-panel" th:each="player, iter : ${players}"
                 th:classappend="${iter.index == 0} ? ' active' : ''"
                 th:attr="data-player-id=${player.id}, data-player-name=${player.username}">
            <div class="player-panel-header">
                <span data-role="turns">Tours : 0</span>
                <span class="player-name" th:text="${player.username}">Name</span>
            </div>

            <div class="player-score" data-role="score">0</div>

            <div class="geo-panel-tags">
                <span class="geo-tag" data-role="name-tag" hidden>Nom trouvé</span>
                <span class="geo-tag" data-role="map-tag" hidden>Placé</span>
            </div>
        </section>
    </div>

    <!----------------------------    PLAYER OVERLAY  ------------------------------------------>


    <!----------------------------    TARGET + MAP  ------------------------------------------>

    <div class="geo-target-section">
        <p class="geo-target-banner" data-role="target-banner">Lance tes 3 fléchettes</p>
        <form class="geo-name-form" data-role="name-form" hidden>
            <input type="text" class="geo-name-input" data-role="name-input" placeholder="Nom du département"
                   autocomplete="off" disabled>
            <button type="submit" class="btn-block" data-role="name-submit" disabled>Valider</button>
        </form>
    </div>


    <div class="geo-map-toolbar" data-role="map-toolbar" hidden>
        <button type="button" class="keypad-mode-toggle" data-action="zoom-out" title="Zoom arrière">&#8722;</button>
        <button type="button" class="keypad-mode-toggle" data-action="zoom-in" title="Zoom avant">&#43;</button>
    </div>

    <div class="geo-map-wrap" data-role="map-wrap" hidden>
        <svg viewBox="0 0 1000 960" class="geo-map" data-role="geo-map" aria-label="Carte de France, départements">
