<!--
    Single template for every Cricket variant. `variant` (a model attribute
    the controller sets to "cricket" or "cricket-honour") is rendered as
    data-variant below; game-cricket-common.js reads it to pick which
    checkWinner/populateWinOverlay pair runs the board — that pair alone is
    what makes a variant different, so there is exactly one template and one
    script for all of them.
-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{generic/page-head :: pageHead(${game.name} + ' - Custom Dart Games')}"></head>
<body>
<main class="game-screen" th:attr="data-variant=${variant}">
    <div th:replace="~{generic/back-link :: backLink(@{/dart/play}, 'Retour à la sélection du jeu', true)}"></div>

    <h1 class="game-title" th:text="${game.name}">Game</h1>

    <!----------------------------    PLAYER OVERLAY  ------------------------------------------>

    <div class="players-stack" id="players-stack">
        <section class="player-panel cricket-panel" th:each="player, iter : ${players}"
                 th:classappend="${iter.index == 0} ? ' active focused' : ''"
                 th:attr="data-player-id=${player.id}, data-player-name=${player.username}">
            <div class="player-panel-header">
                <span data-role="turns">Tours : 0</span>
                <span class="player-name" th:text="${player.username}">Name</span>
            </div>

            <div class="player-score" data-role="score">0</div>

            <div class="cricket-grid" data-role="cricket-grid">
                <div class="cricket-box-wrap" th:each="target : ${ {'20','19','18','17','16','15','B'} }"
                     th:attr="data-target=${target}">
                    <button type="button" class="cricket-box" th:attr="data-target=${target}"></button>
                    <span class="cricket-box-label" th:text="${target == 'B'} ? 'Bulle' : ${target}">20</span>
                </div>
            </div>

            <div class="cricket-closed-strip" data-role="closed-strip">
                <span class="closed-dot" th:each="target : ${ {'20','19','18','17','16','15','B'} }"
                      th:attr="data-target=${target}"></span>
            </div>
        </section>
    </div>

    <!----------------------------    PLAYER OVERLAY  ------------------------------------------>


    <!----------------------------    TURN ACTIONS OVERLAY  ------------------------------------------>

    <div th:replace="~{generic/turn-actions :: turnActions}"></div>

    <!----------------------------    TURN ACTIONS OVERLAY  ------------------------------------------>


    <!----------------------------    WIN OVERLAY  ------------------------------------------>

    <div th:replace="~{generic/win-overlay :: winOverlay}"></div>

    <!----------------------------    WIN OVERLAY  ------------------------------------------>


    <!----------------------------    EXIT OVERLAY  ----------------------------------------->

    <div th:replace="~{generic/exit-overlay :: exitOverlay}"></div>

    <!----------------------------    EXIT OVERLAY  ----------------------------------------->

</main>
<script th:src="@{/js/game-common.js}" defer></script>
<script th:src="@{/js/game-turn-engine.js}" defer></script>
<script th:src="@{/js/game-cricket-common.js}" defer></script>
</body>
</html>
